{{HEAD}}<style>
/* 메인: 카테고리 = LP 슬리브. 가로로 넘기면 가운데 판이 올라오고, 누르면 뉴스가 바퀴처럼 도는 목록 */
body{padding:0;overflow-x:hidden}
.glow{position:fixed;left:-20%;right:-20%;top:-25%;height:70vh;background:var(--g,var(--news));opacity:.22;filter:blur(90px);border-radius:50%;transition:background-color .7s;pointer-events:none;z-index:-1}
.view{max-width:640px;margin:0 auto;padding:28px 0 40px;display:flex;flex-direction:column;gap:6px}
.view[hidden]{display:none}
.pad{padding:0 20px}
.view h1,.view h2{font:700 34px/1.1 var(--body);margin:0}
.lead{margin:0;color:var(--muted)}
.lead em{font-family:Georgia,serif;color:var(--g,var(--news));transition:color .7s}

/* 가로 캐러셀: 네이티브 scroll-snap, 크기·기울기만 JS */
.crates{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:80px calc(50% - 115px) 20px;perspective:800px}
.crates::-webkit-scrollbar{display:none}
.crate{flex:none;width:230px;aspect-ratio:1/1.12;scroll-snap-align:center;position:relative;border:0;background:none;padding:0;cursor:pointer;font:inherit;will-change:transform}
.crate:focus-visible{outline:2px solid var(--fg);outline-offset:6px;border-radius:12px}
.disc{position:absolute;left:12%;right:12%;top:6%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#0c0c0f 0 2px,#1d1d23 2px 4px);box-shadow:0 6px 24px #0008;display:grid;place-items:center;transition:transform .7s cubic-bezier(.2,1.3,.4,1)}
.disc .lbl{width:34%;aspect-ratio:1;border-radius:50%;background:var(--c);display:grid;place-items:center;font:700 13px var(--body);color:#111}
.crate.on .disc{transform:translateY(-36%) rotate(220deg)}
.sleeve{position:absolute;left:0;right:0;bottom:0;height:89%;border-radius:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 92%,#fff),color-mix(in srgb,var(--c) 68%,#000));box-shadow:0 18px 40px -12px #000a;display:flex;flex-direction:column;padding:14px;text-align:left;overflow:hidden}
.meta{display:flex;justify-content:space-between;font:700 10px var(--mono);letter-spacing:.1em;color:#111b}
.hole{position:absolute;left:50%;top:44%;width:38%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:#0005;box-shadow:inset 0 2px 8px #0008}
.name{margin-top:auto;font:400 44px/1 var(--display);color:#111}
.caption{text-align:center;min-height:5.5em;transition:opacity .2s}
.caption.fade{opacity:0}
.caption p{margin:0}
.caption .v{font-family:Georgia,"Noto Serif KR",serif;font-style:italic;font-size:17px;text-wrap:balance}
.caption .s{font:500 12px var(--mono);color:var(--muted);margin-top:6px}
.caption .s b{color:var(--g,var(--news))}

/* 뉴스 바퀴 목록 */
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;cursor:pointer;display:grid;place-items:center;text-decoration:none}
.wheel{list-style:none;margin:8px 0 0;padding:calc(30vh - 36px) 20px;height:60vh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask:linear-gradient(transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel li{height:72px;scroll-snap-align:center;transform-origin:left center;will-change:transform}
.row{--c:var(--news);display:flex;align-items:center;gap:14px;height:64px;padding:6px 10px 6px 6px;border-radius:999px;text-decoration:none;transition:background-color .3s,box-shadow .3s}
.row.video{--c:var(--video)} .row.tips{--c:var(--tips)} .row.trend{--c:var(--trend)}
.art{flex:none;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,var(--c) 0 40%,#111 41% 44%,color-mix(in srgb,var(--c) 40%,#111) 45%);display:grid;place-items:center;font:400 18px var(--display);color:#111}
.txt{min-width:0;flex:1;display:flex;flex-direction:column}
.txt b{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.txt small{font:500 10px var(--mono);color:var(--c)}
.go{flex:none;font:700 12px var(--body);padding:6px 12px;border-radius:999px;background:var(--fg);color:var(--bg);opacity:0;transform:scale(.6);transition:.3s}
li.on .row{background:var(--card);box-shadow:0 8px 24px -10px #0008}
li.on .go{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="glow" aria-hidden="true"></div>

<main class="view" id="hub">
  <div class="pad"><h1>뉴스 모아보기</h1><p class="lead">오늘의 소식을 <em>골라 보세요.</em></p></div>
  <div class="crates" aria-label="뉴스 카테고리 (좌우로 넘기기)">{{CRATES}}</div>
  <div class="caption pad" aria-live="polite"><p class="v"></p><p class="s"></p></div>
</main>

<section class="view" id="detail" hidden aria-labelledby="dt">
  <div class="pad bar"><button class="ic" id="back" aria-label="뒤로">‹</button><a class="ic" id="full" aria-label="카드뉴스 전체 보기" title="카드뉴스 전체 보기">▤</a></div>
  <div class="pad"><h2 id="dt"></h2><p class="lead" id="dm"></p></div>
  <ol class="wheel" id="wheel"></ol>
</section>

<script>
const D = {{DATA}};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const box = $(".crates"), crates = [...box.children], cap = $(".caption"), wheel = $("#wheel");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur = -1;

// 각 항목이 목록 가운데에서 몇 칸 떨어졌는지(d) 계산해 style 함수에 넘기고, 가장 가까운 번호를 돌려줌
function measure(list, size, x, style) {
  const r = list.getBoundingClientRect(), mid = x ? r.left + r.width / 2 : r.top + r.height / 2;
  let best = 0, bd = Infinity;
  [...list.children].forEach((el, i) => {
    const b = el.getBoundingClientRect(), d = ((x ? b.left + b.width / 2 : b.top + b.height / 2) - mid) / size;
    if (!still) style(el, d);
    if (Math.abs(d) < bd) { bd = Math.abs(d); best = i; }
  });
  return best;
}

function paintCrates() {
  const i = measure(box, 230, true, (el, d) => {
    const a = Math.min(Math.abs(d), 1.6);
    el.style.transform = `translateX(${-d * 40}px) scale(${1 - a * 0.24}) rotateY(${-d * 14}deg)`;
    el.style.zIndex = 10 - Math.round(a * 3);
    el.style.filter = `brightness(${1 - a * 0.3})`;
  });
  if (i === cur) return;
  cur = i;
  crates.forEach((c, j) => c.classList.toggle("on", j === i));
  const c = D[i];
  document.documentElement.style.setProperty("--g", `var(--${c.color})`);
  cap.classList.add("fade");
  setTimeout(() => {
    cap.querySelector(".v").textContent = c.verdict;
    cap.querySelector(".s").innerHTML = c.items.length ? `<b>${c.items.length}건</b> · ${c.date} · 눌러서 보기` : "COMING SOON";
    cap.classList.remove("fade");
  }, still ? 0 : 160);
}

function paintWheel() {
  const i = measure(wheel, 72, false, (el, d) => {
    const a = Math.abs(d);
    el.style.transform = `translateX(${a * a * 10}px) rotate(${d * 7}deg) scale(${Math.max(0.75, 1 - a * 0.07)})`;
    el.style.opacity = Math.max(0.15, 1 - a * 0.28);
  });
  [...wheel.children].forEach((li, j) => li.classList.toggle("on", j === i));
}

const onFrame = fn => { let q; return () => { cancelAnimationFrame(q); q = requestAnimationFrame(fn); }; };
box.addEventListener("scroll", onFrame(paintCrates), { passive: true });
wheel.addEventListener("scroll", onFrame(paintWheel), { passive: true });
addEventListener("resize", onFrame(paintCrates));

const center = el => box.scrollTo({ left: el.offsetLeft - box.clientWidth / 2 + el.offsetWidth / 2, behavior: still ? "auto" : "smooth" });
crates.forEach((el, i) => el.onclick = () => i === cur ? open(i) : center(el));
box.addEventListener("keydown", e => {
  const n = crates[cur + ({ ArrowRight: 1, ArrowLeft: -1 }[e.key] ?? NaN)];
  if (n) { e.preventDefault(); n.focus(); center(n); }
});

const swap = fn => document.startViewTransition && !still ? document.startViewTransition(fn) : fn();
function open(i) {
  const c = D[i];
  if (!c.items.length) { if (!still) crates[i].animate([{ translate: "0" }, { translate: "-8px" }, { translate: "8px" }, { translate: "0" }], 300); return; }
  swap(() => {
    $("#hub").hidden = true; $("#detail").hidden = false;
    $("#dt").textContent = `${c.name} 뉴스`;
    $("#dm").textContent = `${c.items.length}건 · ${c.date} · 위아래로 돌려 보세요`;
    $("#full").href = `${c.id}/`;
    wheel.innerHTML = c.items.map((x, j) => `<li><a class="row ${x.c}" href="${x.href}"><span class="art">${j + 1}</span><span class="txt"><small>${esc(x.tag)}</small><b>${esc(x.t)}</b></span><span class="go">읽기</span></a></li>`).join("");
    wheel.scrollTop = 0;
    paintWheel();
  });
  history.pushState(null, "", `#${c.id}`);
}
function close() {
  swap(() => { $("#detail").hidden = true; $("#hub").hidden = false; paintCrates(); crates[cur].focus(); });
}
$("#back").onclick = () => history.back();
addEventListener("popstate", () => { if (!$("#detail").hidden) close(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !$("#detail").hidden) history.back(); });

paintCrates();
const start = D.findIndex(c => `#${c.id}` === location.hash);
if (start >= 0) { box.scrollLeft = crates[start].offsetLeft - box.clientWidth / 2 + 115; paintCrates(); open(start); history.replaceState(null, "", `#${D[start].id}`); }
</script>
