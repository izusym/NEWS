# data/**/*.json 커밋 → 빌드 → GitHub Pages 배포
# 매일 06:00 KST(21:00 UTC)에는 AI·경제·증시 RSS 헤드라인을 먼저 모아 커밋 (Claude 사용 안 함)
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: RSS 헤드라인 수집
        if: github.event_name != 'push'
        run: |
          node rss.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "RSS 헤드라인 $(TZ=Asia/Seoul date +%F)" && git pull --rebase && git push; }
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
