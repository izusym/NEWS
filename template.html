<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 모바일 앱 형태: 폭 440px 고정 화면, 어두운 톤 고정 */
:root{
  --display:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif;
  --body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --bg:#0c0c0e; --card:#161619; --line:rgba(255,255,255,.08); --fg:#f3f0ea; --muted:#8f8b85;
  --ill-bg:#131316; --ill-fg:#f3f0ea; --soft:#1d1d21;
  --news:#93a9ff; --video:#e58fa9; --tips:#e2b464; --trend:#8fc4a5;
  --amber:#d6a04a; --rose:#b86e80; --sage:#7f9e89; --slate:#6f86b3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:#050506}
body{margin:0 auto;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
@media (min-width:480px){body{box-shadow:0 0 0 1px var(--line),0 30px 80px #000}}
a{color:inherit}
.appbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.appbar b{flex:1;font-size:15px;font-weight:600;text-align:center}
.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;display:grid;place-items:center;text-decoration:none;flex:none}
.wrap{padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-direction:column;gap:12px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font:800 32px/1.15 var(--display);letter-spacing:-.035em;margin:0;text-wrap:balance}
h1 em{font:italic 400 36px var(--serif);letter-spacing:0;color:var(--amber)}
.verdict{margin:0;font:500 16px/1.6 var(--body);letter-spacing:-.02em;color:var(--fg)}
.t3{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.t3 h2{margin:0;font:500 11px var(--mono);letter-spacing:.08em;color:var(--muted)}
.t3 ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.t3 a{display:flex;gap:12px;align-items:baseline;text-decoration:none;min-width:0}
.t3 .n{font:italic 400 24px/1 var(--serif);color:var(--amber);flex:none;width:18px}
.t3 .t{font-weight:600;font-size:14px;min-width:0}
.note{margin:0;font-size:12px;color:var(--muted)}
.card{--c:var(--news);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:72px}
.card.video{--c:var(--video)} .card.tips{--c:var(--tips)} .card.trend{--c:var(--trend)}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rank{font:italic 400 34px/1 var(--serif);color:var(--c);min-width:26px}
.tag{font:500 10px var(--mono);letter-spacing:.08em;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:999px;padding:3px 10px}
.date{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
h2{font:700 21px/1.38 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figure svg{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:16px}
figure svg text[style*="--display"]{font-weight:800!important;letter-spacing:-.03em}
figcaption{font-size:11px;color:var(--muted)}
.sum{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:l;font-size:14.5px}
.sum li{counter-increment:l;display:flex;gap:10px;min-width:0}
.sum li::before{content:counter(l);flex:none;width:20px;height:20px;margin-top:3px;border-radius:50%;background:var(--soft);color:var(--c);font:500 10px/20px var(--mono);text-align:center}
.why{margin:0;background:var(--soft);border-radius:16px;padding:12px 14px;font-size:14px}
.why b,.src b{color:var(--c);margin-right:6px;font-weight:600}
.src{margin:0;font-size:12.5px;color:var(--muted)}
.src a{color:var(--fg);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--c,var(--amber));outline-offset:3px;border-radius:6px}
footer{font-size:12px;color:var(--muted);line-height:1.6}
</style>
<header class="appbar"><a class="ic" href="{{HOME}}" aria-label="메인으로">‹</a><b>AI 카드뉴스</b><a class="ic" href="{{ROOT}}archive/" aria-label="지난 호 보기" title="지난 호">☰</a></header>
<main class="wrap">
  <section class="top">
    <span class="eyebrow">{{DOTDATE}} · Daily AI</span>
    <h1>{{TITLE}}</h1>
    <p class="verdict">{{VERDICT}}</p>
    <nav class="t3" aria-label="오늘의 TOP 3">
      <h2>TODAY'S TOP 3</h2>
      <ol>
{{TOP3}}
      </ol>
    </nav>
    <p class="note">{{NOTE}}</p>
  </section>
{{CARDS}}
  <footer>
    <a href="{{ROOT}}archive/">지난 호 보기</a><br>
    수집 시각 {{COLLECTED}} (KST). 각 카드의 날짜는 출처 표기 기준이며, 미국 현지 발표는 현지 날짜를 함께 적었습니다. 대표 이미지는 가져오지 못해 키워드 일러스트로 대체했습니다. 성능 수치는 대부분 발표 주체의 자체 주장입니다.
  </footer>
</main>
