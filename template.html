<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: single-column feed of 10 square-ish story cards, ranked, dark-first like an Instagram carousel */
:root{
  --display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --bg:#0e1016; --card:#171a23; --line:#2a2e3c; --fg:#eceff6; --muted:#a0a7bb;
  --ill-bg:#10131b; --ill-fg:#f4f6fb; --soft:#1e2230;
  --news:#62b4ff; --video:#ff72b0; --tips:#ffc552; --trend:#5ce3b3;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f1f2f8; --card:#ffffff; --line:#dcdfeb; --fg:#151823; --muted:#555d73;
    --ill-bg:#e8ebf5; --ill-fg:#151823; --soft:#f0f2f9;
    --news:#1b66c9; --video:#bd145c; --tips:#9a5b00; --trend:#0a7f5b;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f1f2f8; --card:#ffffff; --line:#dcdfeb; --fg:#151823; --muted:#555d73;
  --ill-bg:#e8ebf5; --ill-fg:#151823; --soft:#f0f2f9;
  --news:#1b66c9; --video:#bd145c; --tips:#9a5b00; --trend:#0a7f5b;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;padding:24px 16px 48px;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
a{color:inherit}
.top{display:flex;flex-direction:column;gap:14px}
.eyebrow{font:700 12px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font:400 clamp(32px,9vw,46px)/1.12 var(--display);margin:0;text-wrap:balance}
.verdict{margin:0;font-size:16px;font-weight:500;color:var(--fg)}
.t3{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.t3 h2{margin:0;font:700 12px var(--mono);letter-spacing:.12em;color:var(--muted)}
.t3 ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.t3 a{display:flex;gap:12px;align-items:baseline;text-decoration:none;min-width:0}
.t3 .n{font:400 26px/1 var(--display);color:var(--news);flex:none;width:24px}
.t3 .t{font-weight:700;min-width:0}
.t3 a:hover .t{text-decoration:underline}
.note{margin:0;font-size:13px;color:var(--muted)}
.card{--c:var(--news);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.card.video{--c:var(--video)} .card.tips{--c:var(--tips)} .card.trend{--c:var(--trend)}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rank{font:400 40px/1 var(--display);color:var(--c);min-width:34px}
.tag{font:700 12px var(--mono);letter-spacing:.08em;color:var(--c);border:1.5px solid var(--c);border-radius:999px;padding:3px 11px}
.date{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
h2{font:400 clamp(22px,6vw,27px)/1.3 var(--display);margin:0;text-wrap:balance}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figure svg{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%;border-radius:14px}
figcaption{font-size:11px;color:var(--muted)}
.sum{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:l}
.sum li{counter-increment:l;display:flex;gap:10px;min-width:0}
.sum li::before{content:counter(l);flex:none;width:20px;height:20px;margin-top:3px;border-radius:50%;background:var(--soft);color:var(--c);font:700 11px/20px var(--mono);text-align:center}
.why{margin:0;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.why b,.src b{color:var(--c);margin-right:6px}
.src{margin:0;font-size:13px;color:var(--muted)}
.src a{color:var(--fg);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--c,var(--news));outline-offset:3px;border-radius:4px}
footer{font-size:12px;color:var(--muted);line-height:1.6}
@media (min-width:560px){body{font-size:16px}.card{padding:24px}}
</style>
<main class="wrap">
  <section class="top">
    <span class="eyebrow">Daily AI Card News · {{DOTDATE}} 한국 시간 · <a href="{{HOME}}">메인</a> · <a href="{{ROOT}}archive/">지난 호 보기</a></span>
    <h1>{{TITLE}}</h1>
    <p class="verdict">{{VERDICT}}</p>
    <nav class="t3" aria-label="오늘의 TOP 3">
      <h2>TODAY'S TOP 3</h2>
      <ol>
{{TOP3}}
      </ol>
    </nav>
    <p class="note">{{NOTE}}</p>
  </section>
{{CARDS}}
  <footer>
    <a href="{{ROOT}}archive/">지난 호 보기</a><br>
    수집 시각 {{COLLECTED}} (KST). 각 카드의 날짜는 출처 표기 기준이며, 미국 현지 발표는 현지 날짜를 함께 적었습니다. 대표 이미지는 가져오지 못해 키워드 일러스트로 대체했습니다. 성능 수치는 대부분 발표 주체의 자체 주장입니다.
  </footer>
</main>
